[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diff2commit"
version = "1.0.0"
description = "Review staged Git changes and generate conventional commits with an LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
    "rich>=14,<15",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "basedpyright",
    "bandit",
]

[project.scripts]
diff2commit = "diff2commit.cli:main"

[tool.setuptools]
packages = ["diff2commit"]

[tool.setuptools.package-data]
diff2commit = ["default.yaml"]
